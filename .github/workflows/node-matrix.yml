name: Node Version Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    # Node 20 is past EOL (April 2026); Node 26 prebuilts are unreliable.
    # Both are informational — failures must not block merges.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 20
            experimental: true
          - node-version: 22
            experimental: false
          - node-version: 24
            experimental: false
          - node-version: 26
            experimental: true

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
