services:
  wwv-data-engine:
    build: .
    ports:
      - "5001:5001"
    environment:
      - REDIS_URL=redis://wwv-redis-cache:6379
      - PORT=5001
    depends_on:
      wwv-redis-cache:
        condition: service_healthy
    volumes:
      - engine-data:/app/data
    restart: unless-stopped

  wwv-redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  engine-data:
  redis-data:
