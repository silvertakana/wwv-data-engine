services:
  wwv-data-engine:
    image: ghcr.io/silvertakana/wwv-data-engine:latest
    # Env vars come from Coolify's .env next to this file; required:false keeps
    # a local clone without .env working.
    env_file:
      - path: .env
        required: false
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=redis://wwv-redis-cache:6379
      - PORT=5000
    depends_on:
      wwv-redis-cache:
        condition: service_healthy
    volumes:
      - engine-data:/app/data
    restart: unless-stopped

  wwv-redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  engine-data:
  redis-data:
